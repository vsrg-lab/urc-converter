name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Registry to publish to"
        type: choice
        default: all
        options:
          - all
          - pypi
          - npm
          - crates
          - nuget

permissions:
  contents: read

jobs:
  verify-versions:
    name: Verify manifest versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version parity across all ports
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import sys
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          py_ver = tomllib.loads(Path("libraries/python/pyproject.toml").read_text("utf-8"))["project"]["version"]
          node_ver = json.loads(Path("libraries/node/package.json").read_text("utf-8"))["version"]
          rust_ver = tomllib.loads(Path("libraries/rust/Cargo.toml").read_text("utf-8"))["package"]["version"]
          fsproj = ET.parse("libraries/dotnet/UrcConverter/UrcConverter.fsproj").getroot()
          dotnet_ver = fsproj.findtext(".//Version")

          versions = {
              "python": py_ver,
              "node": node_ver,
              "rust": rust_ver,
              "dotnet": dotnet_ver,
          }
          print("Manifest versions:", versions)
          if len(set(versions.values())) != 1 or not py_ver:
              sys.exit(f"Version mismatch across manifests: {versions}")

          if os.environ.get("EVENT_NAME") == "release":
              tag = os.environ.get("RELEASE_TAG", "")
              expected_tag = f"v{py_ver}"
              if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or tag != expected_tag:
                  sys.exit(f"Release tag '{tag}' does not match manifest version '{expected_tag}'")
          EOF

  publish-pypi:
    name: Publish to PyPI
    needs: verify-versions
    if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Build Python distributions
        run: uv build libraries/python

      - name: Publish to PyPI (OIDC)
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ libraries/python/dist/*

  publish-npm:
    name: Publish to npm
    needs: verify-versions
    if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install and lint
        run: |
          pnpm --dir libraries/node install --frozen-lockfile
          pnpm --dir libraries/node lint

      - name: Publish to npm (OIDC)
        run: pnpm --dir libraries/node stage publish --access public --no-git-checks

  publish-crates:
    name: Publish to crates.io
    needs: verify-versions
    if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'crates'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --manifest-path libraries/rust/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-nuget:
    name: Publish to NuGet
    needs: verify-versions
    if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'nuget'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Pack NuGet package
        run: dotnet pack libraries/dotnet/UrcConverter/UrcConverter.fsproj -c Release -o artifacts

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
